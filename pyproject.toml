[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kilix-playalong"
version = "0.1.0"
description = "Local-first YouTube-to-guitar-tab practice studio"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
authors = [{name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com"}]
dependencies = [
  "kilix-state-py==0.1.0",
  "mido==1.3.3",
  "typing-extensions==4.15.0",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
ml = [
  "basic-pitch[onnx]==0.4.0",
  "demucs @ git+https://github.com/adefossez/demucs.git@eeac1d15891af95b1288d2884b95baa3e5baa96c",
  "setuptools==80.9.0",
]
transcribe = [
  "faster-whisper==1.2.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[project.scripts]
kilix-playalong = "kilix_playalong.cli:main"

[tool.uv]
required-version = ">=0.12.0,<0.13"

[tool.uv.sources]
kilix-state-py = { path = "third_party/kilix-state/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kilix_playalong"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["ml: optional local model-runtime integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kilix_playalong"]

[[tool.mypy.overrides]]
module = ["basic_pitch", "basic_pitch.*", "faster_whisper", "mido"]
ignore_missing_imports = true
